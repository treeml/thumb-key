name: Build Nightshift APK

on:
  push:
    branches:
      - claude/nightshift-tracker-android-u4zozo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs (both flavors)
        working-directory: nightshift-tracker
        run: ./gradlew assembleNightshiftRelease assembleUrodayRelease --no-daemon

      - name: Rename APKs
        run: |
          cp nightshift-tracker/app/build/outputs/apk/nightshift/release/app-nightshift-release.apk nightshift-tracker.apk
          cp nightshift-tracker/app/build/outputs/apk/uroday/release/app-uroday-release.apk uroday-tracker.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shift-tracker-apks
          path: |
            nightshift-tracker.apk
            uroday-tracker.apk

      - name: Attach APKs to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightshift-apk
          name: Nightshift & UroDay Tracker APKs
          body: |
            Latest builds. Two separate apps that install side by side:
            - `nightshift-tracker.apk` — Nightshift (dark theme, overnight shifts)
            - `uroday-tracker.apk` — UroDay (light theme, urology day shifts:
              ward rounds tab + urology tutorials/guides)
            Download on your phone and open to install (see
            nightshift-tracker/README.md for sideload steps).
          files: |
            nightshift-tracker.apk
            uroday-tracker.apk
