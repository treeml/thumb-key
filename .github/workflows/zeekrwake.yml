name: Build ZeekrWake APK

on:
  push:
    branches: [ ccr-7d9dcbe0-7p1mfr ]
    paths: [ 'zeekrwake/**', '.github/workflows/zeekrwake.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APKs
        working-directory: zeekrwake
        run: ./gradlew --no-daemon assemblePlainDebug assembleTapDebug

      - name: Collect
        run: |
          cp zeekrwake/app/build/outputs/apk/plain/debug/app-plain-debug.apk zeekrwake.apk
          cp zeekrwake/app/build/outputs/apk/tap/debug/app-tap-debug.apk zeekrwake-tap.apk
          ls -l zeekrwake*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zeekrwake-apk
          path: zeekrwake*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete zeekrwake --yes --cleanup-tag || true
          gh release create zeekrwake zeekrwake.apk zeekrwake-tap.apk \
            --target "$GITHUB_SHA" \
            --title "ZeekrWake" \
            --notes "Debug-signed sideload builds. Wakes the Zeekr app when the car's BLE advertisement is detected.

          zeekrwake.apk      - installs normally from a browser. No accessibility service.
          zeekrwake-tap.apk  - also auto-taps the connect button. Declares an accessibility
                               service, so Play Protect blocks browser installs: use
                               'adb install zeekrwake-tap.apk'.

          Setup: zeekrwake/README.md"
