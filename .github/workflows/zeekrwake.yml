name: Build ZeekrWake APK

on:
  push:
    branches: [ ccr-7d9dcbe0-7p1mfr ]
    paths: [ 'zeekrwake/**', '.github/workflows/zeekrwake.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: zeekrwake
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename
        run: cp zeekrwake/app/build/outputs/apk/debug/app-debug.apk zeekrwake.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zeekrwake-apk
          path: zeekrwake.apk
