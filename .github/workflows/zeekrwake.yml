name: Build ZeekrWake APK

on:
  push:
    branches: [ ccr-7d9dcbe0-7p1mfr ]
    paths: [ 'zeekrwake/**', '.github/workflows/zeekrwake.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: zeekrwake
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename
        run: cp zeekrwake/app/build/outputs/apk/debug/app-debug.apk zeekrwake.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zeekrwake-apk
          path: zeekrwake.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete zeekrwake --yes --cleanup-tag || true
          gh release create zeekrwake zeekrwake.apk \
            --target "$GITHUB_SHA" \
            --title "ZeekrWake" \
            --notes "Debug-signed sideload build. Wakes the Zeekr app and taps its connect control when the car's BLE advertisement is detected. Setup: zeekrwake/README.md"
